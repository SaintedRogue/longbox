name: Build Longbox server
description: Compile the Longbox Rust server

runs:
  using: composite
  steps:
    - name: Checkout project
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Setup rust
      uses: ./.github/actions/setup-rust

    # This one runs on GitHub-hosted runners with a cold target directory every time,
    # so the cache is worth its download. The self-hosted CI jobs skip it.
    - name: Cache Rust dependencies
      uses: ./.github/actions/cache-rust

    # This action can be called to build in a Linux, macOS, or Windows runner
    # This step only runs when using Linux
    - name: Compile server (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: cargo build --package longbox_server --release
    - name: Compile server (macOS)
      # Alternatively, when running macOS
      if: runner.os == 'macOS'
      shell: bash
      run: cargo build --package longbox_server --release
    - name: Compile server (Windows)
      # Alternatively, when running Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: cargo build --package longbox_server --release
