name: Publish image to GHCR

# Builds the Longbox image on the self-hosted Unraid runner (which drives the host
# Docker daemon, so the Dockerfile's --mount=type=cache persists → ~2-6 min builds),
# pushes it to GHCR, and attaches a Sigstore build-provenance attestation.
#
# NOTE: build with plain `docker build` on the host daemon. Do NOT switch to
# docker/build-push-action's docker-container builder — that runs an isolated
# BuildKit whose cache does not persist, making every build cold (~6 min+).
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build & push (amd64) to GHCR with provenance
    runs-on: [self-hosted, longbox]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # build.rs bakes the git rev; needs real history

      - name: Compute short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -f docker/Dockerfile \
            --build-arg GIT_REV=${{ steps.vars.outputs.sha }} \
            --build-arg BUILD_CHANNEL=stable \
            -t ghcr.io/saintedrogue/longbox:latest \
            -t ghcr.io/saintedrogue/longbox:${{ steps.vars.outputs.sha }} \
            .

      # The push is retried because the runner's egress DNS is not dependable. A push that
      # has already uploaded every layer still fails the job if the *manifest* request
      # can't resolve the registry:
      #
      #   Head "https://ghcr.io/v2/saintedrogue/longbox/blobs/sha256:42a5...":
      #     dial tcp: lookup ghcr.io on 8.8.8.8:53: read udp ...->8.8.8.8:53: i/o timeout
      #
      # Docker retries individual blob uploads on its own (the same run logged
      # "Retrying in 5 seconds" and recovered), but nothing retries the manifest, and one
      # failed step discards a build that took minutes. `docker push` is idempotent —
      # already-uploaded layers come back as "Layer already exists" — so re-running it is
      # cheap and safe. This does not fix the underlying resolver flakiness on the Unraid
      # host; it stops a momentary one from costing a publish.
      - name: Push image
        id: push
        env:
          IMAGE: ghcr.io/saintedrogue/longbox
          SHA_TAG: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail

          push_with_retry() {
            local ref="$1" attempt=1 delay=10
            local max=5
            until docker push "$ref"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::docker push $ref failed after $max attempts"
                return 1
              fi
              echo "::warning::docker push $ref failed (attempt $attempt/$max); retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          push_with_retry "$IMAGE:latest"
          push_with_retry "$IMAGE:$SHA_TAG"

          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$SHA_TAG" | cut -d@ -f2)
          # An empty digest here would surface as a confusing failure inside the
          # attestation action instead of at its actual cause.
          if [ -z "$digest" ]; then
            echo "::error::could not resolve the pushed digest for $IMAGE:$SHA_TAG"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/saintedrogue/longbox
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
