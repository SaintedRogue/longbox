name: 'Longbox Checks CI'
on:
  pull_request:
    # TODO(sea-orm): Undo
    branches:
      - '**'
      - '!breaking/sea-orm'
  push:
    branches:
      - main
      - nightly

jobs:
  code-changes-check:
    runs-on: [ubuntu-22.04]
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
      frontend-changed: ${{ steps.filter.outputs.frontend == 'true' }}
      rust-changed: ${{ steps.filter.outputs.rust == 'true' }}
      docs-changed: ${{ steps.filter.outputs.docs == 'true' }}
      docker-changed: ${{ steps.filter.outputs.docker == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            docs:
              - './docs/**'
            frontend:
              - './apps/web/**'
              - './packages/**'
              - './.github/actions/setup-yarn/action.yml'
              # Root config that governs the frontend lint/type-check/test run — a change
              # here (e.g. the check-types task ordering) must re-run the frontend job.
              - './nx.json'
              - './package.json'
              - './tsconfig.json'
              - './yarn.lock'
              - './lerna.json'
            rust:
              - './apps/server/**'
              - './core/**'
              - './crates/**'
              - './.github/actions/setup-rust/action.yml'
            docker: ./docker/**

  # A `docker/**` change previously ran nothing at all: the `docker` filter below
  # was declared but no job consumed it, so a broken Dockerfile merged green and
  # failed later in the publish workflow -- where the only visible symptom is
  # `latest` quietly not moving.
  #
  # The Rust builder stage is deliberately not built here. It is by far the most
  # expensive stage, and the code inside it is already covered by `check-rust`;
  # what this job exists to catch is breakage in the Dockerfile itself.
  check-docker:
    needs: code-changes-check
    if: "!contains(github.event.pull_request.head.ref, 'release/v') && needs.code-changes-check.outputs.docker-changed == 'true'"
    name: Docker checks
    runs-on: [self-hosted]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Dockerfile-level lint only (casing, deprecated syntax, and so on). Measured
      # against a Dockerfile with a deliberately unbalanced quote inside a RUN, this
      # still exits 0 -- it does not read shell. It is kept because it costs a couple
      # of seconds and covers every stage, but the steps below are the real check.
      - name: Lint Dockerfile
        run: docker build --check -f docker/Dockerfile .

      # Executing the stages is what actually catches a malformed RUN script: the
      # same broken Dockerfile that `--check` passed fails here. Between them these
      # two cover three of the four network-dependent steps.
      #
      # The builder stage is excluded on purpose -- it is a full Rust release
      # compile, which is far too expensive to run per PR, and its code is already
      # covered by `check-rust`. A broken RUN *in that stage alone* will therefore
      # still get through to the publish workflow.
      - name: Build pdfium stage
        run: docker build -f docker/Dockerfile --target pdfium .

      - name: Build frontend stage
        run: docker build -f docker/Dockerfile --target frontend .

  check-rust:
    needs: code-changes-check
    if: "!contains(github.event.pull_request.head.ref, 'release/v') && needs.code-changes-check.outputs.rust-changed == 'true'"
    name: Rust checks
    runs-on: [self-hosted]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup rust
        uses: ./.github/actions/setup-rust
        with:
          cache-dependencies: false

      - name: Run cargo checks
        run: |
          cargo fmt --all -- --check
          cargo clippy -- -D warnings

      - name: Verify GraphQL schema
        run: |
          cargo dump-schema -- --check

      - name: Run tests
        run: cargo test

  check-coverage:
    if: "!contains(github.event.pull_request.head.ref, 'release/v') && needs.code-changes-check.outputs.rust-changed == 'true'"
    name: Coverage checks
    needs: [code-changes-check, check-rust]
    runs-on: [self-hosted]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run coverage
        uses: ./.github/actions/coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          cache-dependencies: false

  check-typescript:
    needs: code-changes-check
    if: "!contains(github.event.pull_request.head.ref, 'release/v') && needs.code-changes-check.outputs.frontend-changed == 'true'"
    name: TypeScript checks
    runs-on: [ubuntu-22.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node and Yarn
        uses: ./.github/actions/setup-yarn

      - name: Run TypeScript lints
        run: yarn lint

      - name: Run TypeScript tests
        run: yarn test

  # TODO(ci): Add vercel dev deployment?
  check-docs:
    needs: code-changes-check
    if: "!contains(github.event.pull_request.head.ref, 'release/v') && needs.code-changes-check.outputs.docs-changed == 'true'"
    name: Check documentation
    runs-on: [ubuntu-22.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node and Yarn
        uses: ./.github/actions/setup-yarn

      - name: Build documentation app
        run: yarn docs build
