"""
One entity type's slice of a unified search.

`total_count` is the number of matches across the whole server, not the
length of `nodes` -- the caller uses it to decide whether to offer "N more"
and to link into that type's own fully-paginated query.
"""
type MediaSearchGroup {
	nodes: [Media!]!
	totalCount: Int!
}

"How to merge external metadata values onto existing entity metadata"
enum MergeStrategy {
	"Only populate fields that are currently nullish"
	FILL_GAPS
	"Overwrite existing values with (truthy) external data"
	PREFER_EXTERNAL
	"PreferExternal for scalars, merge/dedupe for array fields"
	PREFER_EXTERNAL_AND_MERGE_LISTS
	"FillGaps and merge/dedupe for array fields"
	FILL_AND_MERGE_LISTS
}

