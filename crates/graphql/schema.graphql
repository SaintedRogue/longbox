	id: Int!
	providerType: MetadataProvider!
	enabled: Boolean!
	"""
	Preference order among providers (lower = higher priority; the lowest is the
	"preferred" provider). Breaks ties when multiple providers return a confident
	match. Defaults to 0 at the DB layer.
	"""
	position: Int!
	apiTokenExpiresAt: DateTime
	autoApplyConfig: JSON
	createdAt: DateTime!
	updatedAt: DateTime
}

"""
An enum representing the different types of metadata resets that can occur,
which manifest differently depending on the context
"""
enum MetadataResetImpact {
	"""
	A reset which affects one or more series depending on context:
	- When mutating a library, will reset all series metadata
	- When mutating a series, will reset all its own metadata
	"""
	SERIES
	"""
	A reset which affects one or more books depending on context:
	- When mutating a library, will reset all book metadata in all
	library's series
	- When mutating a series, will reset all its own books
	- When mutating a book, will reset all its own metadata
	"""
	BOOKS
	"""
	A reset which affects multiple different entities (series, books) depending on context:
	- When mutating a library, will reset all metadata in all library's series and books
	- When mutating a series, will reset all its own metadata and books
	"""
	EVERYTHING
}

input MetadataRetryConfigInput {
	"Which metadata fetch statuses to retry (e.g. RATE_LIMITED, FAILED)"
	statuses: [MetadataFetchStatus!]!
}

"""
Editable search fields for an on-demand metadata match. Every field is
optional: a value the user supplies *overrides* what Longbox would otherwise
derive from the item's stored metadata or parsed filename, while a `None`
field falls back to that automatic derivation. Reused by both the media
(issue) and series fetch mutations, so callers can refine a bad auto-match
(e.g. a filename the parser split wrong) instead of being stuck with it.
"""
input MetadataSearchInput {
	"""
	Series / book title to search for. On a media search this overrides both
	the free-text title term and the `series_name` signal, so every provider
	honors it (ComicVine matches on series name, Metron on the title term).
	"""
	title: String
	"Issue number to search for (media search only; ignored for series)."
	number: String
	"Release / cover year, used to disambiguate same-named results."
	year: Int
	"Publisher, used to disambiguate same-named results (media search only)."
	publisher: String
}

