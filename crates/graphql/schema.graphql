	Parse a raw comic filename into a best-effort `{series, number, year}` to
	pre-fill the on-demand metadata-search fields. Pure and heuristic — it
	reads no database rows or secrets, so a lightweight read guard suffices.
	"""
	parseComicFilename(name: String!): ParsedComicFilename!
	"Return all metadata fetch records that are awaiting user review."
	pendingMetadataMatches: [MetadataFetchRecord!]!
	"""
	Every registered plugin.
	
	Server-owner only, and not because the list is especially sensitive: a plugin is
	an arbitrary URL this server will call with a credential attached, so who may see
	and change that set is the same question as who may administer the server.
	"""
	plugins: [Plugin!]!
	pluginById(id: Int!): Plugin
	"""
	The plugin protocol revision this build speaks, so the settings UI can tell an
	operator which version a plugin they are about to write should target.
	"""
	pluginProtocolVersion: Int!
	"""
	The full metadata a provider holds for one of its own records.
	
	Exists because some providers' search endpoints are list views. League of Comic
	Geeks has no API, so a search result is a card: title, publisher, cover, date. The
	summary, page count, ISBN, credits and characters are only on the item's own page,
	which means a review grid built from search results shows a column of dashes.
	
	Rather than fetching every result's page during a search — three quarters of which
	nobody opens, and which on a whole-library match would add hours against a
	15-requests-per-minute ceiling — the client calls this for the one candidate a
	person actually selected. The provider response cache makes re-opening the same
	review free.
