	"Number of entities that were skipped (already have matches)"
	skipped: Int!
	"Number of entities that failed during fetch"
	failed: Int!
	"Number of entities that were auto-applied"
	autoApplied: Int!
	"Number of entities that were rate-limited"
	rateLimited: Int!
}

