	Deliberately unpaginated. A shelf only exists for two or more books that share a
	series identity, so a library produces a handful of these, not hundreds — on the
	library this was built for, 139 loose books yielded 8 shelves.
	"""
	bookGroups(libraryId: ID!): [BookGroup!]!
	bookGroupById(id: ID!): BookGroup
	"Series ids the viewer follows."
	followedSeriesIds: [ID!]!
	"""
	One Sunday-aligned week of expected releases, day by day (all seven days
	are present, empty or not, so the grid renders without gap logic).
	"""
	releaseCalendar(weekOffset: Int! = 0, scope: CalendarScope! = EVERYTHING): [CalendarDay!]!
	"""
	A month laid out as a grid: six whole weeks of cells, every one present whether or
	not it has anything on it, so the frontend renders rows without gap logic.
	"""
	releaseCalendarMonth(monthOffset: Int! = 0, scope: CalendarScope! = EVERYTHING): CalendarMonth!
	"""
	Everything expected from today onward, grouped by day.
	
	Unlike the week grid this omits days with nothing on them: it is a list of what is
	coming, and a run of empty dates carries no information in that framing.
	"""
	upcomingReleases(days: Int! = 90, scope: CalendarScope! = EVERYTHING): [CalendarDay!]!
	"Whether the calendar is syncing, and when it last did."
	releaseCalendarStatus: ReleaseCalendarStatus!
	"New books in followed series, newest first — 30-day window, hard cap."
	updatesFeed(days: Int! = 30, cap: Int! = 500): UpdatesFeed!
	"""
	Search books, series, libraries, authors and characters in one request.
	
	This is a *preview* endpoint: each group is capped, and expanding one type
	means calling that type's own paginated query with the same search string
	rather than paginating here. That keeps the fan-out cheap and means
	expanding one group never refetches the others.
	"""
	searchAll(
		"The search string. Terms are AND-ed, as they are for the per-entity `search` arguments."
		query: String!,
		"Maximum results per entity type."
		limitPerType: Int! = 5
	): SearchAllResult!
	"A single folder by id."
	libraryFolder(id: ID!): LibraryFolder
	"""
	Browse or search folders.
	
	With `parentId`, returns that folder's direct children. Without it, and
	with `libraryId`, returns the folders directly beneath that library's root.
	`search` matches folder names only -- never paths -- so a library mounted
	at `/mnt/comics` does not match every folder in it for the term "comics".
	"""
	libraryFolders(
		"Restrict to one library."
		libraryId: ID,
		"Return the direct children of this folder. Without it, returns folders at the library root."
		parentId: ID,
		"Match against folder names. Terms are AND-ed."
		search: String
	): [LibraryFolder!]!
	me: User!
	userCount: Int!
	topReaders(take: Int): [User!]!
	users(pagination: Pagination! = {offset: {page: 1, pageSize: 20, zeroBased: false}}): PaginatedUserResponse!
